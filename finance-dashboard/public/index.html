<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>My Finances</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock screen -->
  <section id="lock-screen" class="lock" hidden>
    <div class="lock-card">
      <div class="brand-mark" aria-hidden="true"></div>
      <h1>My Finances</h1>
      <p class="lock-intro" id="lock-intro"></p>
      <form id="lock-form" autocomplete="off">
        <label class="field">
          <span>Passphrase</span>
          <input type="password" id="passphrase" required autocomplete="current-password">
        </label>
        <div class="strength" id="strength" aria-live="polite"><div class="strength-bar"><i id="strength-fill"></i></div><span id="strength-label"></span></div>
        <label class="field" id="confirm-row" hidden>
          <span>Confirm passphrase</span>
          <input type="password" id="passphrase-confirm" autocomplete="new-password">
        </label>
        <button type="submit" class="btn primary block" id="lock-submit"></button>
        <p class="form-error" id="lock-error" role="alert"></p>
      </form>
      <p class="lock-foot">Encrypted on this computer · Nothing leaves it except calls to Plaid</p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><span>My Finances</span></div>
      <div class="nav" id="nav"></div>
      <div class="sidebar-foot">
        <span class="env-badge" id="env-badge" hidden></span>
        <button class="nav-item" id="lock-btn" type="button"></button>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title"></h1>
        <label class="search" id="global-search-wrap">
          <span class="search-icon" id="global-search-icon"></span>
          <input id="global-search" type="search" placeholder="Search transactions" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>
        <div class="topbar-actions">
          <button class="btn ghost" id="refresh-btn" type="button" title="Refresh from your banks"></button>
          <button class="btn ghost" id="lock-top" type="button" title="Lock" aria-label="Lock"></button>
          <button class="btn primary" id="add-btn" type="button"></button>
        </div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Overlays -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
  <dialog class="dialog" id="dialog"></dialog>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script src="app.js"></script>
</body>
</html>
